[package]
name = "cambium-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cambi, the cambium command line interface"
readme = "../../README.md"
keywords = ["bazel", "monorepo", "ci", "build", "incremental"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "cambi"
path = "src/main.rs"

[dependencies]
cambium-diff.workspace = true
cambium-engine.workspace = true
cambium-index.workspace = true
cambium-ui.workspace = true
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
# `serde`: `cambi init` writes the store section by serialising the engine's
# own `StoreConfig`, so the spelling it writes is the spelling the engine
# parses, by construction.
toml_edit = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
cambium-bazel.workspace = true
cambium-synth.workspace = true
cambium-testkit.workspace = true
