name: bench-nightly

# Nightly real-repository validation for the two cheapest subjects
# (docs/METHODOLOGY.md). `bazel` and `envoy` are the only repos small
# enough, and cheap enough to fetch, to run every night; the rest are weekly or
# monthly (bench-weekly.yml). Each runs under its own `.bazelversion` — that
# cambium reads 7.x, 8.x and 9.x graphs alike is the `bazel-version-matrix` job
# in ci.yml, over the synthetic workspace, on every pull request.
#
# Machine requirement: this needs a real Bazel build of each repo at several
# commits, so a standard GitHub-hosted runner will not do. Point
# BENCH_RUNNER (an Actions variable) at a self-hosted or larger runner label
# with at least 16 cores, 64 GB RAM and 500 GB disk; until that is set this
# falls back to ubuntu-latest, where the bazel/envoy jobs are expected to be
# slow or to fail on disk space.

on:
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to run (default: both bazel and envoy)"
        required: false
        type: choice
        options: [both, bazel, envoy]
        default: both

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: bench ${{ matrix.subject }}
    # `matrix.*` is not available in a job-level `if`; GitHub refused to parse
    # the file and recorded a zero-job failure on every push. The dispatch
    # input selects the matrix instead.
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(inputs.subject == 'bazel' && '["bazel"]' || inputs.subject == 'envoy' && '["envoy"]' || '["bazel","envoy"]') }}
    env:
      CAMBIUM_SUBJECTS_DIR: ${{ github.workspace }}/.cache/cambium/subjects
      CAMBIUM_BAZEL_DIFF_DIR: ${{ github.workspace }}/.cache/cambium/bazel-diff
      CAMBIUM_TANGO_DIR: ${{ github.workspace }}/.cache/cambium/tango
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Cache bazel-diff build
        uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_BAZEL_DIFF_DIR }}
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh

      - name: Cache tango build
        uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_TANGO_DIR }}
          key: tango-${{ hashFiles('tools/tango/**') }}
      - run: tools/tango/fetch.sh

      - name: Cache per-repo Bazel repository/disk cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/repository_cache
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/disk_cache
          key: bench-cache-${{ matrix.subject }}-${{ github.run_id }}
          restore-keys: |
            bench-cache-${{ matrix.subject }}-

      - run: cargo build --release -p cambium-cli -p cambium-bench-cli

      - name: bench subjects fetch
        run: ./target/release/cambium-bench --cambi ./target/release/cambi subjects fetch ${{ matrix.subject }}
      - name: bench subjects build
        run: ./target/release/cambium-bench --cambi ./target/release/cambi subjects build ${{ matrix.subject }}
      - name: bench history --commits 50
        run: ./target/release/cambium-bench --cambi ./target/release/cambi history ${{ matrix.subject }} --commits 50
      - name: bench changes
        run: |
          ./target/release/cambium-bench --cambi ./target/release/cambi changes ${{ matrix.subject }} \
            --kind pr,adjacent,stress --oracle rdeps,load
      - name: bench report
        if: always()
        run: ./target/release/cambium-bench report ${{ matrix.subject }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ matrix.subject }}
          # The report rewrites docs/RESULTS.md in the runner's checkout and
          # nothing commits it; the artifact is the only copy that leaves.
          path: |
            bench-results/
            docs/RESULTS.md
