name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the tiers that are too slow for a pull request.
    - cron: "17 5 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the version; installing it here rather than
      # letting the first cargo call auto-install keeps the step that fails
      # legible.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lint-next:
    name: clippy on the next toolchain (advisory)
    runs-on: ubuntu-latest
    # Never blocks. Its job is to say "the next stable adds a lint" while the
    # pinned gate keeps main green, so bumping rust-toolchain.toml is a commit
    # with the fixes in it rather than an emergency.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `+stable` on the command line is the one form that outranks
      # rust-toolchain.toml, so this really does run the newer clippy.
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings

  soundness:
    name: soundness sweep (small)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The oracle that matters: the engine's answer must contain everything a
      # full rebuild reports, over many seeds and every change preset.
      - run: cargo test --release -p cambium-engine --test soundness -- --nocapture
        env:
          CAMBIUM_SOUNDNESS_SIZE: small
          CAMBIUM_SOUNDNESS_SEEDS: "24"
          CAMBIUM_SOUNDNESS_REVISIONS: "10"

  e2e:
    name: end-to-end against Bazel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: cargo test --release -p cambium-engine --test e2e_bazel -- --test-threads=1
        env:
          CAMBIUM_E2E: "1"

  bench:
    name: benchmarks (small, medium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cambium-cli
      - run: |
          ./target/release/cambi bench run \
            --preset small,medium --runs 5 \
            --out bench-results/ci.json --markdown bench-results/ci.md
      # Machine fingerprints differ between runners, so gating only makes sense
      # against a baseline captured on the same runner class; `bench compare`
      # refuses to compare across machines rather than reporting noise.
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/

  synthetic-threeway:
    name: synthetic three-way vs bazel-diff (small, typical-pr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache bazel-diff build
        uses: actions/cache@v4
        with:
          path: ~/.cache/cambium/bazel-diff
          # Keyed on the pinned commit in the fetch script, so a bump of
          # BAZEL_DIFF_COMMIT/BAZEL_DIFF_TAG invalidates the cache and forces
          # a rebuild rather than silently reusing the old binary.
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh
      - run: cargo build --release -p cambium-cli
      - name: bench legacy (small, typical-pr)
        run: |
          ./target/release/cambi bench legacy --preset small --changes typical-pr \
            --output json | tee bench-legacy.json
      - name: fail on any disagreement
        # `bench legacy` itself already fails when bazel-diff reports a label
        # cambium does not (unsoundness). This step is the CI-side belt: it
        # reads the same JSON `extra` fields (crates/bench/src/legacy.rs) and
        # fails if `cambium_only`/`bazel_diff_only` show anything other than
        # the documented select()-only asymmetry, or if `agreed` is zero.
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("bench-legacy.json") as f:
              doc = json.load(f)

          stages = doc.get("stages", doc if isinstance(doc, list) else [doc])
          for stage in stages:
              extra = stage.get("extra", stage)
              agreed = extra.get("agreed")
              bd_only = extra.get("bazel_diff_only")
              cam_only = extra.get("cambium_only")
              if agreed is None or bd_only is None:
                  continue
              print(f"agreed={agreed} cambium_only={cam_only} bazel_diff_only={bd_only}")
              if bd_only:
                  print("::error::bazel-diff reported labels cambium missed (unsoundness)")
                  sys.exit(1)
              if not agreed and not cam_only:
                  print("::error::no agreement at all between cambium and bazel-diff")
                  sys.exit(1)
          EOF

  bazel-version-matrix:
    name: bazel version matrix (${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.4.1", "8.5.1", "9.2.0"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      BAZELISK_VERSION: "v1.26.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cache bazelisk downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazelisk
          key: bazelisk-${{ matrix.bazel }}-${{ env.BAZELISK_VERSION }}
      - name: Install bazelisk
        run: |
          mkdir -p "$HOME/.cache/cambium/bin"
          curl -sSL -o "$HOME/.cache/cambium/bin/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          chmod +x "$HOME/.cache/cambium/bin/bazelisk"
          "$HOME/.cache/cambium/bin/bazelisk" --version
      - name: Cache bazel-diff build
        uses: actions/cache@v4
        with:
          path: ~/.cache/cambium/bazel-diff
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh
      - name: Cache tango build
        uses: actions/cache@v4
        with:
          path: ~/.cache/cambium/tango
          key: tango-${{ hashFiles('tools/tango/fetch.sh') }}
      - run: tools/tango/fetch.sh
      - run: cargo test -p cambium-compare --test smoke_real_bazel -- --ignored --nocapture
      - run: cargo test --release -p cambium-engine --test e2e_bazel -- --test-threads=1
        env:
          CAMBIUM_E2E: "1"

  nightly:
    name: nightly (medium soundness, large benchmarks)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p cambium-engine --test soundness -- --nocapture
        env:
          CAMBIUM_SOUNDNESS_SIZE: medium
          CAMBIUM_SOUNDNESS_SEEDS: "8"
          CAMBIUM_SOUNDNESS_REVISIONS: "10"
      - run: cargo build --release -p cambium-cli
      - run: |
          ./target/release/cambi bench run --preset large --runs 3 \
            --stage build_index,load_index,splice,reverse_rebuild,walk,e2e_memory \
            --out bench-results/nightly.json --markdown bench-results/nightly.md
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-results
          path: bench-results/
