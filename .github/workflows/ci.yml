name: ci

# The gate on every push and pull request that touches code: format, lints,
# and the unit and integration tests that need no Bazel. A docs-only push
# runs nothing, and a newer push to the same ref cancels the older run.
# Everything that needs Bazel, a release build, or more than a few minutes
# runs weekly instead (weekly.yml), or on demand from the Actions tab.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the version; installing it here rather than
      # letting the first cargo call auto-install keeps the step that fails
      # legible.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

