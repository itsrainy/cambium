name: corpus-weekly

# The three expensive corpus repos (docs/CORPUS.md, spec §3-§6):
# sourcegraph, apollo and xla run weekly; tensorflow — the biggest, and the
# one entry that carries `skip = true` in corpus.toml — runs monthly (or on
# demand) and is asked to ignore that flag.
#
# Machine requirement: same as corpus-nightly.yml — at least 16 cores, 64 GB
# RAM and 500 GB disk, several times over for xla/tensorflow's external
# fetches. Point the CORPUS_RUNNER Actions variable at hardware that meets
# this; ubuntu-latest is a placeholder that will not have the disk for it.

on:
  schedule:
    - cron: "0 6 * * 0" # weekly: sourcegraph, apollo, xla
    - cron: "0 8 1 * *" # monthly: tensorflow
  workflow_dispatch:
    inputs:
      repo:
        description: "Corpus repo id to run (default: the whole tier for the day)"
        required: false
        type: choice
        options: [all-weekly, sourcegraph, apollo, xla, tensorflow]
        default: all-weekly

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  weekly:
    name: corpus all ${{ matrix.repo }}
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.repo == 'all-weekly' || inputs.repo == matrix.repo))
    runs-on: ${{ vars.CORPUS_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        repo: [sourcegraph, apollo, xla]
    env:
      CAMBIUM_CORPUS_DIR: ${{ github.workspace }}/.cache/cambium/corpus
      CAMBIUM_BAZEL_DIFF_DIR: ${{ github.workspace }}/.cache/cambium/bazel-diff
      CAMBIUM_TANGO_DIR: ${{ github.workspace }}/.cache/cambium/tango
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_BAZEL_DIFF_DIR }}
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_TANGO_DIR }}
          key: tango-${{ hashFiles('tools/tango/fetch.sh', 'tools/tango/cmd/**') }}
      - run: tools/tango/fetch.sh

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CAMBIUM_CORPUS_DIR }}/repository_cache
            ${{ env.CAMBIUM_CORPUS_DIR }}/disk_cache
          key: corpus-cache-${{ matrix.repo }}-${{ github.run_id }}
          restore-keys: |
            corpus-cache-${{ matrix.repo }}-

      - run: cargo build --release -p cambium-cli
      - run: ./target/release/cambi corpus all ${{ matrix.repo }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results-${{ matrix.repo }}
          path: corpus-results/

  monthly:
    name: corpus all tensorflow
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.repo == 'tensorflow')
    runs-on: ${{ vars.CORPUS_RUNNER || 'ubuntu-latest' }}
    env:
      CAMBIUM_CORPUS_DIR: ${{ github.workspace }}/.cache/cambium/corpus
      CAMBIUM_BAZEL_DIFF_DIR: ${{ github.workspace }}/.cache/cambium/bazel-diff
      CAMBIUM_TANGO_DIR: ${{ github.workspace }}/.cache/cambium/tango
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_BAZEL_DIFF_DIR }}
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_TANGO_DIR }}
          key: tango-${{ hashFiles('tools/tango/fetch.sh', 'tools/tango/cmd/**') }}
      - run: tools/tango/fetch.sh

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CAMBIUM_CORPUS_DIR }}/repository_cache
            ${{ env.CAMBIUM_CORPUS_DIR }}/disk_cache
          key: corpus-cache-tensorflow-${{ github.run_id }}
          restore-keys: |
            corpus-cache-tensorflow-

      - run: cargo build --release -p cambium-cli
      # tensorflow carries `skip = true` in corpus.toml. As of this writing
      # `cambi corpus` has no `--force`-the-manifest flag to ignore that, so
      # this step will fail fast until either such a flag is added or the
      # manifest's `skip` is flipped for a manual, deliberate run. Whoever
      # wires that up should replace this comment with the real invocation
      # (e.g. `corpus all tensorflow --force`).
      - run: ./target/release/cambi corpus all tensorflow

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results-tensorflow
          path: corpus-results/
