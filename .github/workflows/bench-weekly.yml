name: bench-weekly

# The three expensive subjects (docs/METHODOLOGY.md):
# sourcegraph, apollo and xla run weekly; tensorflow — the biggest, and the
# one entry that carries `skip = true` in subject_repos.toml — runs monthly (or on
# demand) and is asked to ignore that flag.
#
# Machine requirement: same as bench-nightly.yml — at least 16 cores, 64 GB
# RAM and 500 GB disk, several times over for xla/tensorflow's external
# fetches. Point the BENCH_RUNNER Actions variable at hardware that meets
# this; ubuntu-latest is a placeholder that will not have the disk for it.

on:
  schedule:
    - cron: "0 6 * * 0" # weekly: sourcegraph, apollo, xla
    - cron: "0 8 1 * *" # monthly: tensorflow
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to run (default: the whole tier for the day)"
        required: false
        type: choice
        options: [all-weekly, sourcegraph, apollo, xla, tensorflow]
        default: all-weekly

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  weekly:
    name: bench ${{ matrix.subject }}
    # `matrix.*` is not available in a job-level `if`; GitHub refused to parse
    # the file and recorded a zero-job failure on every push. The dispatch
    # input selects the matrix instead.
    if: (github.event_name == 'workflow_dispatch' && inputs.subject != 'tensorflow') || github.event.schedule == '0 6 * * 0'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(inputs.subject == 'sourcegraph' && '["sourcegraph"]' || inputs.subject == 'apollo' && '["apollo"]' || inputs.subject == 'xla' && '["xla"]' || '["sourcegraph","apollo","xla"]') }}
    env:
      CAMBIUM_SUBJECTS_DIR: ${{ github.workspace }}/.cache/cambium/subjects
      CAMBIUM_BAZEL_DIFF_DIR: ${{ github.workspace }}/.cache/cambium/bazel-diff
      CAMBIUM_TANGO_DIR: ${{ github.workspace }}/.cache/cambium/tango
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_BAZEL_DIFF_DIR }}
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_TANGO_DIR }}
          key: tango-${{ hashFiles('tools/tango/**') }}
      - run: tools/tango/fetch.sh

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/repository_cache
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/disk_cache
          key: bench-cache-${{ matrix.subject }}-${{ github.run_id }}
          restore-keys: |
            bench-cache-${{ matrix.subject }}-

      - run: cargo build --release -p cambium-cli
      - run: ./target/release/cambi bench subjects fetch ${{ matrix.subject }}
      - run: ./target/release/cambi bench subjects build ${{ matrix.subject }}
      - run: ./target/release/cambi bench history ${{ matrix.subject }}
      - run: ./target/release/cambi bench changes ${{ matrix.subject }}
      - if: always()
        run: ./target/release/cambi bench report ${{ matrix.subject }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ matrix.subject }}
          path: |
            bench-results/
            docs/RESULTS.md

  monthly:
    name: bench tensorflow
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.subject == 'tensorflow')
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    env:
      CAMBIUM_SUBJECTS_DIR: ${{ github.workspace }}/.cache/cambium/subjects
      CAMBIUM_BAZEL_DIFF_DIR: ${{ github.workspace }}/.cache/cambium/bazel-diff
      CAMBIUM_TANGO_DIR: ${{ github.workspace }}/.cache/cambium/tango
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_BAZEL_DIFF_DIR }}
          key: bazel-diff-${{ hashFiles('tools/bazel-diff/fetch.sh') }}
      - run: tools/bazel-diff/fetch.sh

      - uses: actions/cache@v4
        with:
          path: ${{ env.CAMBIUM_TANGO_DIR }}
          key: tango-${{ hashFiles('tools/tango/**') }}
      - run: tools/tango/fetch.sh

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/repository_cache
            ${{ env.CAMBIUM_SUBJECTS_DIR }}/disk_cache
          key: bench-cache-tensorflow-${{ github.run_id }}
          restore-keys: |
            bench-cache-tensorflow-

      - run: cargo build --release -p cambium-cli
      # tensorflow carries `skip = true` in subject_repos.toml, which only ever
      # bounds the "every subject" form of `bench subjects`; naming it runs it,
      # which is what a deliberate monthly job is.
      - run: ./target/release/cambi bench subjects fetch tensorflow
      - run: ./target/release/cambi bench subjects build tensorflow
      - run: ./target/release/cambi bench history tensorflow
      - run: ./target/release/cambi bench changes tensorflow
      - if: always()
        run: ./target/release/cambi bench report tensorflow

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-tensorflow
          path: |
            bench-results/
            docs/RESULTS.md
