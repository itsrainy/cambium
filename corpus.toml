# The real-repository corpus (docs/CORPUS.md, spec §3).
#
# Pins are bumped deliberately, in a PR that regenerates that repo's section
# of docs/CORPUS.md. Order is the order the repos were brought up.
#
# Each entry runs under its own `.bazelversion` (or `bazel_version` where the
# repo has none to give, as apollo does). Bazel major coverage — that cambium
# reads 7.x, 8.x and 9.x graphs alike — is CI's `bazel-version-matrix` job over
# the synthetic corpus, not duplicate entries here.

[[repo]]
id = "bazel"
url = "https://github.com/bazelbuild/bazel.git"
pin = "948b8c70e281c2fe42aa5468dad543c7af9f0ccc"
replay_range = 300
bazel = "bazelisk"
extra_query_flags = []
# No repo-specific invalidators: builtins_bzl/** and tools/build_defs/repo/**
# are ordinary sources compiled into the Bazel binary, not files the workspace
# being queried loads. Listing them cost a third of this repo's replay globals.
invalidators = []
notes = "small, clean, macro-heavy Java; fast first target"

[[repo]]
id = "envoy"
url = "https://github.com/envoyproxy/envoy.git"
pin = "7ba51266cc60cd560c37ea9cb3e2adf70676b6cf"
replay_range = 300
bazel = "bazelisk"
extra_query_flags = []
# NOTE (external-repository stage, `crates/index/src/externals.rs`): the engine
# now derives `.github/config.yml`, `changelogs/**`, `api/**`, `VERSION.txt`,
# `API_VERSION.txt` and `bazel/repo.bzl` itself from `MODULE.bazel` and the
# workspace `.bzl` closure, and maps each onto `@envoy_repo` / `@envoy_api`
# rather than onto the world. Over envoy's last 50 first-parent commits before
# this pin, 23 touch one of those paths — every one of them a global
# invalidation today — and the stage makes 21 of the 23 repository-scoped, the
# remaining two staying global for good reasons (`bazel: Remove WORKSPACE`, and
# a `toolchains_llvm` bump). The entries below are kept until a replay on a
# format-5 index shows the resulting *affected sets* are right too; that needs a
# cold envoy build, which this laptop cannot do. Delete them with that evidence.
#
# `bazel/repo.bzl` defines the `@envoy_repo` repository rule, which runs `yq`
# over `.github/config.yml` at load time and writes the build-image digests
# into a generated `containers.bzl`. Those digests land in the `exec_properties`
# of the RBE `platform` rules, so a "deps: Bump build images" commit that
# touches nothing but `.github/config.yml` really does move four rule hashes.
# No query can see that edge — the file belongs to no package and is not a
# `.bzl`, so neither the file->target map nor `rbuildfiles` names it — which is
# what invalidators are for. Without these three entries the replay oracle
# fails at the pin with `rule hash mismatches: 4`
# (//bazel/platforms/rbe:linux_{x64,arm64},
# //bazel/rbe/toolchains:rbe_linux_gcc_platform and
# //bazel/rbe/toolchains/configs/linux/gcc/config:platform).
invalidators = [
    "bazel/repositories.bzl",
    "bazel/repository_locations.bzl",
    # envoy lists `api` in `.bazelignore` and re-exposes it as the external
    # repo `@envoy_api` (`bazel/api_binding.bzl` symlinks every entry of
    # `api/` into a generated repository). So `api/**` holds no main-repo
    # package, cambium's file->target map cannot name a consumer for anything
    # under it, and an edit to a single `.proto` there looks like a no-op --
    # while `//tools/proto_format:proto_sync`, `//tools/code:check` and the
    # `//distribution:*` tree really do depend on it through `@envoy_api`.
    # Indexing external repositories would be the precise answer; until then a
    # global invalidation is the sound one.
    "api/**",
    # `@envoy_repo//:project` is a filegroup in the generated `@envoy_repo`
    # whose srcs include `//changelogs:changelogs`, and
    # `//distribution/dockerhub:readme*` plus
    # `//tools/distribution:update_dockerhub_repository` reach the changelogs
    # only through it:
    #   somepath(//distribution/dockerhub:readme_json, //changelogs:changelogs)
    #     //distribution/dockerhub:readme_json
    #     @envoy_repo//:project
    #     //changelogs:changelogs
    # The path leaves `//...` and comes back, and cambium's index stops at the
    # first external node, so an edit under `changelogs/` reaches the filegroup
    # and no further -- the rdeps oracle caught it as recall 0.87 on
    # 54796eba3..83297dad1 (a "ratelimit: retry-after header" commit whose only
    # non-source file is `changelogs/current/...rst`). Same shape as `api/**`
    # above: indexing external repositories is the precise answer, a global
    # invalidation is the sound one.
    "changelogs/**",
    "bazel/repo.bzl",
    ".github/config.yml",
    "VERSION.txt",
]
notes = "C++, tens of thousands of targets, deep .bzl layering, heavy select; external fetch ~6 GB"

[[repo]]
id = "sourcegraph"
# sourcegraph/sourcegraph went private in 2024; this is the archived public
# snapshot (last push 2024-09-02), which still has the busy Gazelle-generated
# history the replay wants.
url = "https://github.com/sourcegraph/sourcegraph-public-snapshot.git"
pin = "c864f15af264f0f456a6d8a83290b5c940715349"
replay_range = 300
bazel = "bazelisk"
extra_query_flags = []
invalidators = ["dev/bazel/**", "go.mod", "go.sum", "pnpm-lock.yaml"]
notes = "Go + TS, Gazelle-generated BUILD files, busy commit history; best updater replay"

[[repo]]
id = "apollo"
url = "https://github.com/ApolloAuto/apollo.git"
pin = "d53aa3da47a06a08e6d0cd175d5623a34fa0d6aa"
replay_range = 300
bazel = "bazelisk"
# The repo has no .bazelversion and its deps are all declared in WORKSPACE,
# with a MODULE.bazel that is the empty placeholder Bazel's migration message
# suggests. Bazel 9 (what bazelisk picks by default) no longer reads WORKSPACE,
# so @rules_python and friends are invisible to the main repo and 770 of its
# 771 packages fail to load. Under 7.4.1 the same pin loads 746 packages, with
# only @local_config_cuda failing (no CUDA on the corpus host).
bazel_version = "7.4.1"
# ...and 7.4.1 in turn cannot read the repo's own tools/bazel.rc, which from 67
# commits back passes `query --experimental_multi_threaded_digest=true`, a flag
# Bazel dropped after 6.x. An unrecognised option is a hard failure, not a
# degraded query, so the replay range is unreachable without ignoring the
# workspace rc. Apollo's rc holds no --deleted_packages or other
# graph-affecting query options, so dropping it costs nothing here.
extra_startup_flags = ["--noworkspace_rc"]
extra_query_flags = []
invalidators = ["tools/**", "third_party/**"]
notes = "C++ AV stack; graph shape closest to the target production repo"

[[repo]]
id = "xla"
url = "https://github.com/openxla/xla.git"
pin = "076fe93fad26cb2555e3bb86defa6a772d11cf35"
replay_range = 300
bazel = "bazelisk"
extra_query_flags = []
invalidators = ["third_party/**", "xla/tsl/**/*.bzl", "workspace*.bzl"]
notes = "very large, most complex Starlark; brings up the hard cases; ~1 h loading, large fetch"

[[repo]]
id = "tensorflow"
url = "https://github.com/tensorflow/tensorflow.git"
pin = "01990a8ef1f82e62ffffc77ac0d1adc78dc5ee69"
replay_range = 300
bazel = "bazelisk"
extra_query_flags = []
invalidators = ["third_party/**", "tensorflow/workspace*.bzl", "tensorflow/tensorflow.bzl"]
skip = true
notes = "largest public Bazel graph; stretch target, monthly or on demand; hours, very large fetch"
