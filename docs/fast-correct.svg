<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="A shelf under a sign reading {Fast, Correct}, choose two. The Correct box is still on the shelf; a little tree-stump character called cambi walks off holding two boxes, both labeled Fast.">
  <style>
    .paper { fill: #fbf8f2; }
    .ink { fill: none; stroke: #2b2b2b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .txt { fill: #2b2b2b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .hand { font-family: "Comic Sans MS", "Chalkboard SE", ui-rounded, sans-serif; }
    .wood { fill: #e9c99a; }
    .ring { fill: none; stroke: #b98a55; stroke-width: 2; }
    .bark { fill: #8a5a34; }
    .box { fill: #f3e3c3; }
    .fast { fill: #ffd7c4; }
    .correct { fill: #d3e8d8; }
    .ghost { fill: none; stroke: #2b2b2b; stroke-width: 1.5; stroke-dasharray: 6 5; opacity: 0.5; }
    .dot { fill: #2b2b2b; }
    .tag { fill: #fbf8f2; }
    .zip { stroke: #e8613a; stroke-width: 2.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .paper, .tag { fill: #1f1d1a; }
      .ink, .ghost { stroke: #e8e4dc; }
      .txt, .dot { fill: #e8e4dc; }
      .wood { fill: #c9a274; }
      .ring { stroke: #7a5634; }
      .bark { fill: #6b4426; }
      .box { fill: #3a332a; }
      .fast { fill: #6a3524; }
      .correct { fill: #2f4636; }
      .zip { stroke: #ff8a5c; }
    }
  </style>

  <rect class="paper" x="0" y="0" width="640" height="380" rx="12"/>

  <!-- sign -->
  <line class="ink" x1="170" y1="6" x2="170" y2="26"/>
  <line class="ink" x1="370" y1="6" x2="370" y2="26"/>
  <rect class="box ink" x="130" y="26" width="280" height="76" rx="8"/>
  <text class="txt" x="270" y="62" font-size="26" font-weight="700">{Fast, Correct}</text>
  <text class="txt hand" x="270" y="88" font-size="16" font-style="italic">choose two</text>

  <!-- shelf -->
  <rect class="bark ink" x="40" y="232" width="350" height="12" rx="2"/>
  <polyline class="ink" points="70,244 70,288 108,244"/>
  <polyline class="ink" points="360,244 360,288 322,244"/>

  <!-- where Fast used to be -->
  <rect class="ghost" x="60" y="170" width="120" height="62" rx="4"/>
  <text class="txt hand" x="120" y="206" font-size="13" opacity="0.55">(gone)</text>

  <!-- Correct, untouched -->
  <rect class="correct ink" x="220" y="170" width="140" height="62" rx="4"/>
  <text class="txt" x="290" y="207" font-size="18" font-weight="700">Correct</text>

  <!-- floor -->
  <line class="ink" x1="20" y1="352" x2="620" y2="352" opacity="0.5"/>

  <!-- cambi: legs -->
  <polyline class="ink" points="512,282 502,348 490,348"/>
  <polyline class="ink" points="532,282 544,348 558,348"/>

  <!-- trunk -->
  <rect class="bark ink" x="496" y="186" width="52" height="98" rx="10"/>
  <rect class="tag ink" x="503" y="244" width="38" height="18" rx="3" stroke-width="1.5"/>
  <text class="txt" x="522" y="257" font-size="11">cambi</text>

  <!-- head: a tree-ring cross-section -->
  <circle class="wood ink" cx="522" cy="148" r="38"/>
  <circle class="ring" cx="522" cy="148" r="30"/>
  <circle class="ring" cx="522" cy="148" r="21"/>
  <circle class="ring" cx="522" cy="148" r="12"/>
  <circle class="dot" cx="509" cy="142" r="3.5"/>
  <circle class="dot" cx="535" cy="142" r="3.5"/>
  <path class="ink" d="M508 156 Q522 170 536 156"/>

  <!-- arms -->
  <polyline class="ink" points="498,204 476,224 470,214"/>
  <polyline class="ink" points="546,204 568,224 574,214"/>

  <!-- the two Fasts -->
  <rect class="fast ink" x="410" y="186" width="74" height="50" rx="4" transform="rotate(-8 447 211)"/>
  <text class="txt" x="447" y="217" font-size="17" font-weight="700" transform="rotate(-8 447 211)">Fast</text>
  <rect class="fast ink" x="552" y="186" width="74" height="50" rx="4" transform="rotate(8 589 211)"/>
  <text class="txt" x="589" y="217" font-size="17" font-weight="700" transform="rotate(8 589 211)">Fast</text>

  <!-- speed lines -->
  <line class="zip" x1="586" y1="290" x2="616" y2="290"/>
  <line class="zip" x1="576" y1="304" x2="612" y2="304"/>
  <line class="zip" x1="590" y1="318" x2="618" y2="318"/>
</svg>
