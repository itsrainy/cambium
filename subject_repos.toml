# The real subjects: open-source Bazel repositories cambium is benchmarked
# against (docs/METHODOLOGY.md).
#
# Each entry is a subject with a URL, a pinned commit, a history window (how
# many first-parent commits before the pin a workload may use), and the Bazel
# version it runs under: its own `.bazelversion`, or a `bazel_version` pin here
# only when the subject has none to give, as apollo does. Bazel 7/8/9 coverage
# of cambium itself is CI's synthetic version matrix; a subject is never pinned
# twice to exercise another Bazel major.
#
# Pins are bumped deliberately, in a change that regenerates that subject's
# section of docs/RESULTS.md. Order is the order the subjects were brought up.
#
# Synthetic subjects are not listed here: they are named `synth:<preset>` on
# the command line and generated on demand.

[[repo]]
id = "bazel"
url = "https://github.com/bazelbuild/bazel.git"
pin = "948b8c70e281c2fe42aa5468dad543c7af9f0ccc"
history_window = 300
bazel = "bazelisk"
extra_query_flags = []
# No repo-specific invalidators: builtins_bzl/** and tools/build_defs/repo/**
# are ordinary sources compiled into the Bazel binary, not files the workspace
# being queried loads. Listing them cost a third of this subject's history globals.
invalidators = []
notes = "small, clean, macro-heavy Java; fast first target"

[[repo]]
id = "envoy"
url = "https://github.com/envoyproxy/envoy.git"
pin = "7ba51266cc60cd560c37ea9cb3e2adf70676b6cf"
history_window = 300
bazel = "bazelisk"
extra_query_flags = []
# What used to be listed here (api/**, changelogs/**, .github/config.yml,
# VERSION.txt, API_VERSION.txt, and the repository-defining .bzl files) is
# now derived at index time from MODULE.bazel and the workspace .bzl
# closure (crates/index/src/externals.rs); the rebuild oracle re-derives
# rule hashes at every step, so a regression here would show as a mismatch.
invalidators = []
notes = "C++, tens of thousands of targets, deep .bzl layering, heavy select; external fetch ~6 GB"

[[repo]]
id = "sourcegraph"
# sourcegraph/sourcegraph went private in 2024; this is the archived public
# snapshot (last push 2024-09-02), which still has the busy Gazelle-generated
# history the history workload wants.
url = "https://github.com/sourcegraph/sourcegraph-public-snapshot.git"
pin = "c864f15af264f0f456a6d8a83290b5c940715349"
history_window = 300
bazel = "bazelisk"
# Its .bazeliskrc routes bazelisk to the Aspect CLI (USE_BAZEL_VERSION=aspect/…),
# whose `query` wrapper fails bazel-diff's --query_file invocation outright.
# The suite runs the plain Bazel its .bazelversion names instead, for every
# tool alike; see `bazelisk_env` in crates/bench/src/checkout.rs.
extra_query_flags = []
# `go.mod` / `go.sum` are not read by Bazel here (WORKSPACE mode; gazelle's
# `go_repository` calls are checked in), `pnpm-lock.yaml` is the
# `pnpm_lock =` label of WORKSPACE's `npm_translate_lock`, which the index
# derives, and `dev/bazel/` does not exist at the pin. Fifteen of this
# subject's twenty-four history globals were these entries.
invalidators = []
notes = "Go + TS, Gazelle-generated BUILD files, busy commit history; best updater exercise"

[[repo]]
id = "apollo"
url = "https://github.com/ApolloAuto/apollo.git"
pin = "d53aa3da47a06a08e6d0cd175d5623a34fa0d6aa"
# 74, not 300: commit cd510fe5, 76 back from the pin, does not load under any
# Bazel (`third_party/gpus/cuda_configure.bzl` lacks `make_copy_files_rule`,
# so the main repository mapping itself fails). A history run cannot cross it, and
# 74 is the longest first-parent range that stays clear of it.
history_window = 74
bazel = "bazelisk"
# The repo has no .bazelversion and its deps are all declared in WORKSPACE,
# with a MODULE.bazel that is the empty placeholder Bazel's migration message
# suggests. Bazel 9 (what bazelisk picks by default) no longer reads WORKSPACE,
# so @rules_python and friends are invisible to the main repo and 770 of its
# 771 packages fail to load. Under 7.4.1 the same pin loads 746 packages, with
# only @local_config_cuda failing (no CUDA on the benchmark host).
bazel_version = "7.4.1"
# ...and 7.4.1 in turn cannot read the repo's own tools/bazel.rc, which from 67
# commits back passes `query --experimental_multi_threaded_digest=true`, a flag
# Bazel dropped after 6.x. An unrecognised option is a hard failure, not a
# degraded query, so the history window is unreachable without ignoring the
# workspace rc. Apollo's rc holds no --deleted_packages or other
# graph-affecting query options, so dropping it costs nothing here.
extra_startup_flags = ["--noworkspace_rc"]
extra_query_flags = []
# `@local_config_cuda//cuda` cannot load without CUDA on the host, so the
# pin's index is PARTIAL by one package on every run; the engine refuses to
# publish such an index unless told the absence is understood.
publish_partial = true
# Every file these globs caught in the published run is reached by label:
# `*_configure.bzl` and `workspace.bzl` files are in the workspace load
# closure, `BUILD.tpl` / `*.patch` / `*.BUILD` are `Label(...)` inputs of the
# repository rules that read them, `install.py.in` is an attr default of an
# ordinary rule. The recall oracle is what confirms it on the box.
invalidators = []
notes = "C++ AV stack; graph shape closest to the target production repo"

[[repo]]
id = "xla"
url = "https://github.com/openxla/xla.git"
pin = "076fe93fad26cb2555e3bb86defa6a772d11cf35"
history_window = 300
bazel = "bazelisk"
extra_query_flags = []
# Same reasoning as apollo: the patches and templates under third_party/ are
# `patch_file` / `attr.label` inputs of workspace-closure repository rules,
# the `.bzl` files are closure-handled, and `third_party/tsl/**` sources are
# both: Bazel 8.7 walks past the `REPO.bazel` marker, so they are ordinary
# main-repo packages, *and* the directory is the repository `@tsl`, so a
# change there is answered twice, once as those packages and once as the
# whole repository dirty by input (docs/OVER_REPORTING.md, "Traversed
# boundary counted twice"). Neither half needs an invalidator. Unverified
# offline (no local mirror); the box's recall oracle is the gate.
invalidators = []
# The four `tools/toolchains/win_1803/py3{8,9}` packages are Windows
# toolchains that cannot load on Linux, so the pin's index is PARTIAL by
# exactly those on every run (docs/OPERATIONS.md); the engine refuses to
# publish a partial index unless told the absence is understood.
publish_partial = true
notes = "very large, most complex Starlark; brings up the hard cases; ~1 h loading, large fetch"

[[repo]]
id = "tensorflow"
url = "https://github.com/tensorflow/tensorflow.git"
pin = "01990a8ef1f82e62ffffc77ac0d1adc78dc5ee69"
history_window = 300
bazel = "bazelisk"
extra_query_flags = []
invalidators = ["tensorflow/workspace*.bzl", "tensorflow/tensorflow.bzl"]
skip = true
notes = "largest public Bazel graph; stretch target, monthly or on demand; hours, very large fetch"
