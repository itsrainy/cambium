[workspace]
resolver = "2"
members = [
    "crates/index",
    "crates/synth",
    "crates/cambium-proto",
    "crates/bazel",
    "crates/diff",
    "crates/classify",
    "crates/engine",
    "crates/cli",
    "crates/bench",
    "crates/bench-cli",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/itsrainy/cambium"

[workspace.dependencies]
cambium-index = { path = "crates/index" }
cambium-proto = { path = "crates/cambium-proto" }
cambium-bazel = { path = "crates/bazel" }
cambium-diff = { path = "crates/diff" }
cambium-classify = { path = "crates/classify" }
cambium-engine = { path = "crates/engine" }
cambium-synth = { path = "crates/synth" }
cambium-bench = { path = "crates/bench" }
# Test fixtures only: a dev-dependency of the crates whose `tests/` share them.
cambium-testkit = { path = "crates/testkit" }

anyhow = "1"
thiserror = "2"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
fixedbitset = "0.5"
globset = "0.4"
memmap2 = "0.9"
proptest = "1"
prost = "0.13"
prost-build = "0.13"
protox = "0.7"
# The live matrix view (`cambium-bench watch`). ratatui 0.29 is the last
# release whose MSRV (1.74) is under this workspace's 1.80, and it pins
# crossterm 0.28 itself — taken here at that exact minor so the tree holds one
# crossterm and the backend types in it are the ones ratatui was built against.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1"
# Pinned exactly: rkyv's derive decides the on-disk layout, so a minor
# upgrade can move the bytes without a line of cambium changing. See the
# fixture test in crates/index/tests/format_fixture.rs, and bump this and
# FORMAT_VERSION together and deliberately.
rkyv = "=0.8.18"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Already in the lock as `toml`'s own parser; taken directly so that `cambi
# init` can rewrite a checked-in cambium.toml without reformatting it or
# dropping its comments.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
zstd = "0.13"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 1
