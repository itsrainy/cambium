[workspace]
resolver = "2"
# `demos/` holds standalone crates for trying out terminal output shapes.
# They are built by hand, never by a workspace-wide `cargo build`.
exclude = ["demos"]
members = [
    "crates/index",
    "crates/synth",
    "crates/cambium-proto",
    "crates/bazel",
    "crates/diff",
    "crates/classify",
    "crates/engine",
    "crates/ui",
    "crates/cli",
    "crates/bench",
    "crates/bench-cli",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/itsrainy/cambium"

[workspace.dependencies]
# The crates cambi is built from carry a version as well as a path, because
# crates.io refuses a path-only dependency. Keep it equal to
# workspace.package.version. The bench and testkit crates are never
# published (publish = false), so they stay path-only.
cambium-index = { path = "crates/index", version = "0.1.0" }
cambium-proto = { path = "crates/cambium-proto", version = "0.1.0" }
cambium-bazel = { path = "crates/bazel", version = "0.1.0" }
cambium-diff = { path = "crates/diff", version = "0.1.0" }
cambium-classify = { path = "crates/classify", version = "0.1.0" }
cambium-engine = { path = "crates/engine", version = "0.1.0" }
cambium-ui = { path = "crates/ui", version = "0.1.0" }
cambium-synth = { path = "crates/synth", version = "0.1.0" }
cambium-bench = { path = "crates/bench" }
# Test fixtures only: a dev-dependency of the crates whose `tests/` share them.
cambium-testkit = { path = "crates/testkit" }

anyhow = "1"
thiserror = "2"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
fixedbitset = "0.5"
globset = "0.4"
# The string table's hash index (crates/index/src/strtab.rs): `HashTable`
# only, which needs no hasher, so no default features. Kept at the version
# rkyv's `alloc` feature already pulls in, so the tree holds one hashbrown of
# ours; lru (via ratatui) still brings its own 0.15.
hashbrown = { version = "0.17", default-features = false }
memmap2 = "0.9"
prost = "0.13"
prost-build = "0.13"
protox = "0.7"
# The live matrix view (`cambium-bench watch`). crossterm is taken at the
# minor ratatui pins so the tree holds one crossterm and the backend types in
# it are the ones ratatui was built against.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1"
# Pinned exactly: rkyv's derive decides the on-disk layout, so a minor
# upgrade can move the bytes without a line of cambium changing. See the
# fixture test in crates/index/tests/format_fixture.rs, and bump this and
# FORMAT_VERSION together and deliberately.
rkyv = "=0.8.18"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Already in the lock as `toml`'s own parser; taken directly so that `cambi
# init` can rewrite a checked-in cambium.toml without reformatting it or
# dropping its comments.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
zstd = "0.13"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

# What scripts/package-release.sh builds for a release tarball: the release
# profile without the line tables, stripped. On Linux `debug = 1` links the
# DWARF into the binary itself, which a download does not need.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.bench]
debug = 1
