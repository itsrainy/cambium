[workspace]
resolver = "2"
members = [
    "crates/index",
    "crates/synth",
    "crates/cambium-proto",
    "crates/bazel",
    "crates/diff",
    "crates/classify",
    "crates/engine",
    "crates/cli",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/itsrainy/cambium"

[workspace.dependencies]
cambium-index = { path = "crates/index" }
cambium-proto = { path = "crates/cambium-proto" }
cambium-bazel = { path = "crates/bazel" }
cambium-diff = { path = "crates/diff" }
cambium-classify = { path = "crates/classify" }
cambium-engine = { path = "crates/engine" }
cambium-synth = { path = "crates/synth" }
cambium-bench = { path = "crates/bench" }

anyhow = "1"
thiserror = "2"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
fixedbitset = "0.5"
globset = "0.4"
memmap2 = "0.9"
proptest = "1"
prost = "0.13"
prost-build = "0.13"
protox = "0.7"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1"
rkyv = "0.8"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 1
